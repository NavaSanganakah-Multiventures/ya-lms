# Wrangler Configuration for ya-lms-nextjs
# Architecture: Workers with Assets
# Environments: Production (Default) and Preview

name = "ya-lms-nextjs"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat_v2"]
preview_urls = true
workers_dev = true

[assets]
directory = "./.vercel/output/static"

# Rules for importing non-js files
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true


# ==========================================
# 🚀 PRODUCTION ENVIRONMENT (Default)
# ==========================================

routes = [
  { pattern = "lms.yagyaashram.com", custom_domain = true }
]

[vars]
ENVIRONMENT = "production"
API_URL = "https://lms.yagyaashram.com"

[[kv_namespaces]]
binding = "PLATFORM_SECRETS"
id = "c805f176b1d14768a6f28ce0327ffd6f"

[[d1_databases]]
binding = "DB"
database_name = "lms-db"
database_id = "f4ac10a4-7ace-4c38-a5cf-b956b1f028fe"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "yagyaashram-lms"

# Preview resources — needed by EnvSyncWorkflow running on production worker
[[kv_namespaces]]
binding = "PREVIEW_KV"
id = "9e88db7c55bd4ff189ad716e1ca8310f"

[[d1_databases]]
binding = "PREVIEW_DB"
database_name = "lms-db-preview"
database_id = "8ac6d05f-1638-41b0-ac81-83238abad191"

[[r2_buckets]]
binding = "PREVIEW_STORAGE"
bucket_name = "yagyaashram-lms-preview"

[[send_email]]
name = "SEND_EMAIL"

[ai]
binding = "AI"

[[ai_search_namespaces]]
binding = "AI_SEARCH"
namespace = "default"

[queues]
producers = [
  { binding = "LESSON_QUEUE", queue = "ya-lms-lesson-processing" },
  { binding = "PUSH_QUEUE", queue = "ya-lms-push-notifications" }
]
consumers = [
  { queue = "ya-lms-lesson-processing", max_batch_size = 5, max_batch_timeout = 30 },
  { queue = "ya-lms-push-notifications", max_batch_size = 50, max_batch_timeout = 5 }
]

[durable_objects]
bindings = [
  { name = "NOTIFICATION_MANAGER", class_name = "NotificationManager" },
  { name = "ADMIN_COMMAND_PROCESSOR", class_name = "AdminCommandProcessor" },
  { name = "DATA_SYNC_DO", class_name = "DataSyncDO" }
]

[[workflows]]
name = "lesson-transcription-workflow"
binding = "LESSON_TRANSCRIPTION_WORKFLOW"
class_name = "LessonTranscriptionWorkflow"

[[workflows]]
name = "env-sync-workflow"
binding = "ENV_SYNC_WORKFLOW"
class_name = "EnvSyncWorkflow"

[triggers]
crons = ["* * * * *", "*/5 * * * *"]

[observability]
enabled = true


[[migrations]]
tag = "v_notification_do_1"
new_classes = ["NotificationManager"]

[[migrations]]
tag = "v_admin_command_processor_1"
new_classes = ["AdminCommandProcessor"]

[[migrations]]
tag = "v_data_sync_do_1"
new_classes = ["DataSyncDO"]


# ==========================================
# 🛠️ PREVIEW ENVIRONMENT
# ==========================================

[env.preview]
# अब प्रीव्यू और प्रोडक्शन दोनों एक ही वर्कर में रहेंगे
name = "ya-lms-nextjs-preview"
compatibility_flags = ["nodejs_compat_v2"]

routes = [
  { pattern = "dev.lms.yagyaashram.com", custom_domain = true }
]

[env.preview.vars]
ENVIRONMENT = "preview"
API_URL = "https://dev.lms.yagyaashram.com"

[[env.preview.kv_namespaces]]
binding = "PLATFORM_SECRETS"
id = "9e88db7c55bd4ff189ad716e1ca8310f"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "lms-db-preview"
database_id = "8ac6d05f-1638-41b0-ac81-83238abad191"

[[env.preview.r2_buckets]]
binding = "STORAGE"
bucket_name = "yagyaashram-lms-preview"

[[env.preview.r2_buckets]]
binding = "PREVIEW_STORAGE"
bucket_name = "yagyaashram-lms-preview"

[[env.preview.kv_namespaces]]
binding = "PREVIEW_KV"
id = "9e88db7c55bd4ff189ad716e1ca8310f"

[[env.preview.d1_databases]]
binding = "PREVIEW_DB"
database_name = "lms-db-preview"
database_id = "8ac6d05f-1638-41b0-ac81-83238abad191"

[[env.preview.send_email]]
name = "SEND_EMAIL"

[env.preview.ai]
binding = "AI"

[[env.preview.ai_search_namespaces]]
binding = "AI_SEARCH"
namespace = "default-preview"

[env.preview.queues]
producers = [
  { binding = "LESSON_QUEUE", queue = "ya-lms-lesson-processing-preview" },
  { binding = "PUSH_QUEUE", queue = "ya-lms-push-notifications-preview" }
]
consumers = [
  { queue = "ya-lms-lesson-processing-preview", max_batch_size = 5, max_batch_timeout = 30 },
  { queue = "ya-lms-push-notifications-preview", max_batch_size = 50, max_batch_timeout = 5 }
]

[env.preview.durable_objects]
bindings = [
  { name = "NOTIFICATION_MANAGER", class_name = "NotificationManager" },
  { name = "ADMIN_COMMAND_PROCESSOR", class_name = "AdminCommandProcessor" },
  { name = "DATA_SYNC_DO", class_name = "DataSyncDO" }
]

[[env.preview.workflows]]
name = "lesson-transcription-workflow-preview"
binding = "LESSON_TRANSCRIPTION_WORKFLOW"
class_name = "LessonTranscriptionWorkflow"

[[env.preview.workflows]]
name = "env-sync-workflow-preview"
binding = "ENV_SYNC_WORKFLOW"
class_name = "EnvSyncWorkflow"
