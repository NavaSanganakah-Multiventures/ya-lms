# Wrangler Configuration for ya-lms-nextjs
# Architecture: Workers with Assets
# Environments: Production (Default) and Preview

name = "ya-lms-nextjs"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat_v2"]
preview_urls = true

[workers_dev]
enabled = true

[assets]
directory = "./.vercel/output/static"

# Rules for importing non-js files
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

# --- Production Environment (Default) ---

[vars]
ENVIRONMENT = "production"
API_URL = "https://lms.yagyaashram.com"
GEMINI_API_KEY = ""

[[kv_namespaces]]
binding = "PLATFORM_SECRETS"
id = "c805f176b1d14768a6f28ce0327ffd6f"

[[kv_namespaces]]
binding = "MAIN_DATA"
id = "PASTE_PRODUCTION_KV_ID_HERE"

[[d1_databases]]
binding = "DB"
database_name = "lms-db"
database_id = "f4ac10a4-7ace-4c38-a5cf-b956b1f028fe"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "yagyaashram-lms"

[[send_email]]
name = "SEND_EMAIL"

[ai]
binding = "AI"

[[ai_search_namespaces]]
binding = "AI_SEARCH"
namespace = "default"

[queues]
producers = [
  { binding = "LESSON_QUEUE", queue = "ya-lms-lesson-processing" },
  { binding = "PUSH_QUEUE", queue = "ya-lms-push-notifications" }
]
consumers = [
  { queue = "ya-lms-lesson-processing", max_batch_size = 5, max_batch_timeout = 30 },
  { queue = "ya-lms-push-notifications", max_batch_size = 50, max_batch_timeout = 5 }
]

[durable_objects]
bindings = [
  { name = "NOTIFICATION_MANAGER", class_name = "NotificationManager" }
]

[[workflows]]
name = "lesson-transcription-workflow"
binding = "LESSON_TRANSCRIPTION_WORKFLOW"
class_name = "LessonTranscriptionWorkflow"

[triggers]
crons = ["* * * * *", "*/5 * * * *"]

[[migrations]]
tag = "v_notification_do_1"
new_classes = ["NotificationManager"]

# --- Preview Environment ---

[env.preview]
compatibility_flags = ["nodejs_compat_v2"]

[env.preview.vars]
ENVIRONMENT = "preview"
API_URL = "https://dev.lms.yagyaashram.com"
GEMINI_API_KEY = ""

[[env.preview.kv_namespaces]]
binding = "PLATFORM_SECRETS"
id = "c805f176b1d14768a6f28ce0327ffd6f"

[[env.preview.kv_namespaces]]
binding = "MAIN_DATA"
id = "PASTE_PREVIEW_KV_ID_HERE"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "lms-db"
database_id = "f4ac10a4-7ace-4c38-a5cf-b956b1f028fe"

[[env.preview.r2_buckets]]
binding = "STORAGE"
bucket_name = "yagyaashram-lms"

[[env.preview.send_email]]
name = "SEND_EMAIL"

[env.preview.ai]
binding = "AI"

[[env.preview.ai_search_namespaces]]
binding = "AI_SEARCH"
namespace = "default"

[env.preview.queues]
producers = [
  { binding = "LESSON_QUEUE", queue = "ya-lms-lesson-processing" },
  { binding = "PUSH_QUEUE", queue = "ya-lms-push-notifications" }
]

[env.preview.durable_objects]
bindings = [
  { name = "NOTIFICATION_MANAGER", class_name = "NotificationManager" }
]

[[env.preview.workflows]]
name = "lesson-transcription-workflow"
binding = "LESSON_TRANSCRIPTION_WORKFLOW"
class_name = "LessonTranscriptionWorkflow"
