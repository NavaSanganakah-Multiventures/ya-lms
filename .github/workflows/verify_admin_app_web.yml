name: Verify admin_app web build

on:
  push:
    branches:
      - cross-platform-web-android
  workflow_dispatch:

jobs:
  build_web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build admin_app for web
        working-directory: ./flutter/admin_app
        run: |
          flutter config --enable-web
          flutter build web --release \
            --dart-define=API_BASE_URL=https://dev.lms.yagyaashram.com \
            --dart-define=APP_API_SECRET=dummy \
            --dart-define=VAPID_PUBLIC_KEY=dummy
