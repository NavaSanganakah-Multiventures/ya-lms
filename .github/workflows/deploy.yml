name: Push to Main

on:
  push:
    branches:
      - main

jobs:
  push-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Code pushed to main
        run: |
          echo "## Code Pushed to Main" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No auto deploy. Manual trigger required." >> "$GITHUB_STEP_SUMMARY"
