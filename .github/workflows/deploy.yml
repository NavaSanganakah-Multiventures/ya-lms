name: Deploy Worker + Workflow

on:
  push:
    branches: [main, dev, verified]
    paths-ignore:
      - 'flutter/**'
      - '**.md'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build (Next.js + Worker)
        run: npm run build
        env:
          NEXT_PUBLIC_CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          NEXT_PUBLIC_RT_APP_ID: ${{ secrets.RT_APP_ID }}

      - name: Deploy Worker (with LessonTranscriptionWorkflow)
        run: npx wrangler versions upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Route 100% Traffic
        run: npx wrangler versions deploy --yes 100
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Verify Workflow Registration
        run: |
          INFO=$(npx wrangler workflows get lesson-transcription-workflow 2>&1 || true)
          if echo "$INFO" | grep -qi "not found"; then
            echo "Workflow not found — creating..."
            npx wrangler workflows create lesson-transcription-workflow 2>&1
          else
            echo "Workflow is registered"
            echo "$INFO"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
