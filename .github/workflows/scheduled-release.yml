name: Scheduled Release to Verified

on:
  schedule:
    # Runs ONLY on the 16th of the month at 00:00 IST (Midnight)
    # Note: 18:30 UTC on the 15th is 00:00 IST on the 16th.
    - cron: '30 18 15 * *'
  workflow_dispatch: # Allows you to manually trigger the deployment from the GitHub Actions UI

jobs:
  merge-to-verified:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge main into verified
        run: |
          # Checkout verified branch if it exists, otherwise create it from main
          git checkout verified || git checkout -b verified
          
          # Merge the latest main code into verified
          git merge origin/main --no-edit
          
          # Push the verified branch to trigger Cloudflare Deployment
          git push origin verified
