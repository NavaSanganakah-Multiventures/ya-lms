name: Build and Upload Debug APKs to R2

on:
  workflow_dispatch:

jobs:
  build_and_upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies (Admin App)
        working-directory: ./flutter/admin_app
        run: flutter pub get

      - name: Install Dependencies (Student App)
        working-directory: ./flutter/student_app
        run: flutter pub get

      - name: Build Debug APK (Admin App)
        working-directory: ./flutter/admin_app
        run: flutter build apk --debug

      - name: Build Debug APK (Student App)
        working-directory: ./flutter/student_app
        run: flutter build apk --debug

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update

      - name: Upload APKs to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          # Upload Admin Debug APK
          aws s3 cp \
            ./flutter/admin_app/build/app/outputs/flutter-apk/app-debug.apk \
            s3://yagyaashram-lms/apps/admin_app_debug.apk \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

          # Upload Student Debug APK
          aws s3 cp \
            ./flutter/student_app/build/app/outputs/flutter-apk/app-debug.apk \
            s3://yagyaashram-lms/apps/student_app_debug.apk \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
