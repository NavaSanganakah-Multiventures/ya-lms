name: Build and Upload Flutter APK & AAB to R2

on:
  push:
    branches:
      - main
      - dev
      - verified
    paths:
      - 'flutter/student_app/**'
      - '.github/workflows/build_and_upload_apk.yml'
  pull_request:
    branches:
      - main
      - dev
      - verified
    paths:
      - 'flutter/student_app/**'
      - '.github/workflows/build_and_upload_apk.yml'
  workflow_dispatch:

jobs:
  build_and_upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        working-directory: ./flutter/student_app
        run: flutter pub get
      - name: Decode Keystore and Create properties
        working-directory: ./flutter/student_app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
            echo "storePassword=$STORE_PASSWORD" > android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "storeFile=release-keystore.jks" >> android/key.properties
            echo "Keystore and key.properties created successfully."
          else
            echo "No Keystore secrets found. Building with debug keys."
          fi

      - name: Build APK & AAB
        working-directory: ./flutter/student_app
        run: |
          flutter build apk --release
          flutter build appbundle --release


      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update

      - name: Upload APK & AAB to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        # Only upload on push to main, dev, or verified (prevents PRs from overwriting the APK without approval)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          # Upload APK
          aws s3 cp \
            ./flutter/student_app/build/app/outputs/flutter-apk/app-release.apk \
            s3://yagyaashram-lms/apps/student_app.apk \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

          # Upload AAB (App Bundle)
          aws s3 cp \
            ./flutter/student_app/build/app/outputs/bundle/release/app-release.aab \
            s3://yagyaashram-lms/apps/student_app.aab \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
